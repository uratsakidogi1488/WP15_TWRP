name: Building TWRP

on:
  workflow_dispatch:

env:
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-11
  DEVICE: WP15
  DT_LINK: https://github.com/uratsakidogi1488/WP15_TWRP.git
  DT_PATH: device/oukitel/WP15
  TARGET: bootimage
  TZ: Europe/Moscow

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

    - name: Checkout
      uses: actions/checkout@master

    - name: Check Out
      uses: actions/checkout@v4
      
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache build-essential
        git config --global user.name "uratsakidogi1488"
        git config --global user.email "uratsakidogi1488@github.com"
        
    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
 
    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync recovery source and device tree
      run: |
       PATH=~/bin:$PATH
       mkdir twrp
       cd twrp
       repo init -u $MANIFEST --depth=1
       repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
       rm -rf .repo
             
    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
       path: twrp/device/oukitel/WP15

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
       swap-size-gb: 12

    - name: Apply patches
      run: |
       cd twrp
       if git apply --check device/oukitel/WP15/patches/vold_decrypt_fix.patch 2>/dev/null; then
         git apply device/oukitel/WP15/patches/vold_decrypt_fix.patch
         echo "Patch applied successfully"
       else
         echo "Patch already applied or cannot be applied, skipping"
       fi
   
    - name: Build
      run: |
       PATH=~/bin:$PATH
       cd twrp
       export ALLOW_MISSING_DEPENDENCIES=true && source build/envsetup.sh &&lunch twrp_WP15-eng && mka $TARGET -j$(nproc --all)
       cp  out/target/product/WP15/boot.img    out/target/product/WP15/boot-WP15-A11-$(date +"%Y%m%d").img
             
    - name: Release recovery image
      uses: softprops/action-gh-release@v2
      env:
       GITHUB_TOKEN: ${{ secrets.TEST }}
      with:
       tag_name: Oukitel_WP15_RU_V07
       name: TWRP37x_11_RU
       files: | 
         twrp/out/target/product/WP15/boot*.img
