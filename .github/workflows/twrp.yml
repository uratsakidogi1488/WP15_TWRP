name: Building TWRP

on:
  workflow_dispatch:

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp
  MANIFEST_BRANCH: twrp-11
  DEVICE: WP15
  DT_LINK: https://github.com/uratsakidogi1488/WP15_TWRP.git
  DT_PATH: device/oukitel/WP15
  TARGET: bootimage
  TZ: Europe/Moscow

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo DEBIAN_FRONTEND=noninteractive apt -y --no-install-recommends install \
          gperf \
          gcc-multilib \
          g++-multilib \
          gcc-10-multilib \
          g++-10-multilib \
          libc6-dev \
          libx11-dev \
          tree \
          lib32z1 \
          lib32z-dev \
          libgl1-mesa-dev \
          libxml2-utils \
          xsltproc \
          bc \
          ccache \
          unzip \
          zip \
          python3 \
          python3-pip \
          git \
          flex \
          bison \
          liblz4-tool \
          schedtool || { echo "apt install failed"; exit 1; }

        git config --global user.name "uratsakidogi1488"
        git config --global user.email "uratsakidogi1488@github.com"

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -sSf https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync recovery source and device tree
      run: |
       PATH=~/bin:$PATH
       mkdir twrp
       cd twrp
       repo init -u $MANIFEST_URL -b $MANIFEST_BRANCH --depth=1
       # Retry loop to avoid transient RESOURCE_EXHAUSTED errors from upstream
       attempts=0
       max_attempts=3
       backoff=10
       until [ "$attempts" -ge "$max_attempts" ]; do
         repo sync -c -j1 --force-sync --no-clone-bundle --no-tags && break
         attempts=$((attempts+1))
         echo "repo sync failed, attempt $attempts/$max_attempts"
         sleep $backoff
         backoff=$((backoff*2))
       done
       if [ "$attempts" -ge "$max_attempts" ]; then
         echo "repo sync failed after $max_attempts attempts"
         exit 1
       fi
       rm -rf .repo

    - name: Checkout device tree
      uses: actions/checkout@v4
      with:
       path: twrp/device/oukitel/WP15

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
       swap-size-gb: 12

    - name: Apply patches
      run: |
       cd twrp
       if git apply --check device/oukitel/WP15/patches/vold_decrypt_fix.patch 2>/dev/null; then
         git apply device/oukitel/WP15/patches/vold_decrypt_fix.patch
         echo "Patch applied successfully"
       else
         echo "Patch already applied or cannot be applied, skipping"
       fi

    - name: Build
      run: |
       PATH=~/bin:$PATH
       cd twrp
       export ALLOW_MISSING_DEPENDENCIES=true
       source build/envsetup.sh
       lunch twrp_WP15-eng
       mka $TARGET -j$(nproc --all)
       cp  out/target/product/WP15/boot.img    out/target/product/WP15/boot-WP15-A11-$(date +"%Y%m%d").img

    - name: Release recovery image
      uses: softprops/action-gh-release@v2
      env:
       GITHUB_TOKEN: ${{ secrets.TEST }}
      with:
       tag_name: Oukitel_WP15_RU_V07
       name: TWRP37x_11_RU
       files: | 
         twrp/out/target/product/WP15/boot*.img
